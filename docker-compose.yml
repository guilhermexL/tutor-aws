version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    restart: unless-stopped
    # Se tiver GPU NVIDIA, descomente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  api:
    build:
      context: ./api
    container_name: mistral-api
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL: mistral:instruct
      CORS_ORIGINS: http://localhost:3000, http://localhost:5173
    depends_on:
      - ollama
    ports:
      - "8080:8000"
    restart: unless-stopped

volumes:
  ollama:
